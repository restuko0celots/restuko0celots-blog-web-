<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>retsuko0celots blog space</title>
    <style>
        /* --- CONFIGURACIÓN DE COLORES RETRO DARK/PASTEL --- */
        :root {
            --fondo-pagina: #FFE4E1;        /* Rosa Pastel */
            --color-principal: #000000;     /* Negro */
            --texto-blanco: #FFFFFF;
            --verde-detalles: #A5D6A7;      /* Verde Claro */
            --amarillo-detalles: #FFF59D;   /* Amarillo Claro */
            --burdeo-detalles: #E91E63;     /* Burdeo */
        }

        body {
            background-color: var(--fondo-pagina);
            font-family: 'Courier New', Courier, monospace, Arial, sans-serif;
            color: var(--texto-blanco);
            margin: 0;
            padding: 20px;
        }

        /* --- PANTALLA DE ACCESO OBLIGATORIO --- */
        #login-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--fondo-pagina);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .login-box {
            background: #000000;
            border: 4px solid #000000;
            padding: 30px;
            text-align: center;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.15);
            max-width: 400px;
            width: 90%;
        }
        .login-box input[type="email"] {
            width: 80%;
            padding: 10px;
            margin: 15px 0;
            border: 2px solid var(--texto-blanco);
            background: #111111;
            color: var(--amarillo-detalles);
            font-family: inherit;
            text-align: center;
        }
        .btn-retro {
            background: var(--color-principal);
            color: var(--texto-blanco);
            border: 2px solid var(--texto-blanco);
            padding: 8px 15px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        .btn-retro:hover {
            background: var(--burdeo-detalles);
        }

        /* --- CONTENEDOR PRINCIPAL DEL BLOG --- */
        #main-site {
            display: none;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #000000;
            border: 4px solid var(--color-principal);
            padding: 15px;
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.2);
        }

        header {
            background-color: var(--color-principal);
            color: var(--amarillo-detalles);
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 22px;
            margin-bottom: 20px;
            border: 2px dashed var(--verde-detalles);
        }

        /* BANNER SUPERIOR CAMBIABLE */
        .top-banner {
            width: 100%;
            height: 150px;
            background-color: #222222;
            border: 2px solid var(--texto-blanco);
            background-size: cover;
            background-position: center;
            margin-bottom: 15px;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            padding: 10px;
            box-sizing: border-box;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1.6fr;
            gap: 20px;
        }

        .box {
            background-color: var(--color-principal);
            border: 2px solid var(--texto-blanco);
            margin-bottom: 20px;
            box-shadow: 4px 4px 0px var(--texto-blanco);
        }

        .box-title {
            background-color: var(--color-principal);
            color: var(--verde-detalles);
            padding: 8px;
            font-weight: bold;
            font-size: 14px;
            border-bottom: 2px dashed var(--texto-blanco);
            text-transform: uppercase;
        }

        .box-content {
            padding: 12px;
            font-size: 13px;
            line-height: 1.5;
        }

        .box-content b { color: var(--amarillo-detalles); }

        /* LISTA DE ENLACES PARA REDES SOCIALES */
        .social-links {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .social-links li {
            margin-bottom: 8px;
        }
        .social-links a {
            color: var(--amarillo-detalles);
            text-decoration: none;
            font-weight: bold;
        }
        .social-links a:hover {
            color: var(--burdeo-detalles);
            text-decoration: underline;
        }

        .profile-pic-container {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 180px;
            margin: 0 auto 10px auto;
        }

        .profile-pic { 
            width: 100%; 
            aspect-ratio: 1; 
            object-fit: cover; 
            border: 2px solid var(--texto-blanco); 
            display: block;
        }

        .sticker-gallery img { max-height: 45px; border: 1px dashed var(--texto-blanco); padding: 2px; margin: 3px;}
        
        .tabs-nav { display: flex; gap: 5px; margin-bottom: 10px; }
        .tab-btn { flex: 1; background: #111111; color: var(--texto-blanco); border: 2px solid var(--texto-blanco); padding: 8px; cursor: pointer; font-family: 'Courier New', monospace; font-weight: bold; }
        .tab-btn.active { background: var(--verde-detalles); color: var(--color-principal); }
        .tab-content { display: none; border: 2px solid var(--texto-blanco); padding: 12px; background: #050505; min-height: 300px; }
        .tab-content.active { display: block; }

        .blog-post {
            border-bottom: 1px dashed var(--texto-blanco);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .blog-post:last-child { border-bottom: none; }
        .post-date { font-size: 11px; color: var(--amarillo-detalles); margin-bottom: 5px; }
        .post-title { color: var(--burdeo-detalles); margin: 0 0 8px 0; font-size: 16px; }

        .blog-form input, .blog-form textarea {
            width: 95%;
            padding: 8px;
            margin-bottom: 10px;
            background: #111111;
            border: 1px solid var(--texto-blanco);
            color: #fff;
            font-family: inherit;
        }

        .input-file-hidden {
            display: none;
        }

        .btn-file-label {
            background: rgba(0,0,0,0.7);
            color: #fff;
            font-size: 10px;
            padding: 4px 8px;
            border: 1px solid #fff;
            cursor: pointer;
            display: inline-block;
        }

        .locked-feature {
            background: #1a0005;
            border: 2px dashed var(--burdeo-detalles);
            padding: 15px;
            text-align: center;
            color: var(--burdeo-detalles);
            font-weight: bold;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- 1. PANTALLA DE ACCESO RETRO -->
    <div id="login-screen">
        <div class="login-box">
            <h2 style="color: var(--burdeo-detalles); margin-top:0;">★ ACCESO AL PORTAL ★</h2>
            <p style="font-size: 12px;">Introduce tu correo electrónico para desbloquear la zona de personalización y creación.</p>
            <input type="email" id="user-email" placeholder="tu_correo@space.com">
            <br>
            <button class="btn-retro" onclick="entrarComoMiembro()">Entrar Completo ✨</button>
            <p style="margin: 10px 0; font-size:11px;">o visita el espacio básico:</p>
            <button class="btn-retro" style="border-color: var(--verde-detalles);" onclick="entrarComoInvitado()">Ver perfil limitado 👁️</button>
        </div>
    </div>

    <!-- 2. CONTENIDO PRINCIPAL DEL SITIO -->
    <div id="main-site">
        <!-- REPRODUCTOR DE AUDIO ORIGINAL DE NYAN CAT -->
        <audio id="bg-audio" loop preload="auto">
            <source id="audio-source" src="https://archive.org" type="audio/mpeg">
        </audio>

        <div class="container">
            <!-- Banner superior con cambiador de imagen integrado -->
            <div class="top-banner" id="banner-layout" style="background-image: url('https://placeholder.com[+Sube+tu+Banner+Aquí+]');">
                <label class="btn-file-label class-miembro-only" style="display:none;">
                    Cambiar Banner 🖼️
                    <input type="file" class="input-file-hidden" accept="image/*" onchange="cambiarImagenFondo(event, 'banner-layout')">
                </label>
            </div>

            <header>
                ★ retsuko0celots blog space ★
            </header>

            <div class="main-layout">
                <!-- COLUMNA IZQUIERDA -->
                <div class="left-column">
                    <!-- Caja de Información de Usuario -->
                    <div class="box">
                        <div class="box-title">> Blogger Info</div>
                        <div class="box-content" style="text-align: center;">
                            <div class="profile-pic-container">
                                <img class="profile-pic" id="avatar-img" src="https://placeholder.com" alt="Foto de perfil">
                                <label class="btn-file-label class-miembro-only" style="display:none; margin-top:5px;">
                                    Cambiar Foto 👤
                                    <input type="file" class="input-file-hidden" accept="image/*" onchange="cambiarImagenElemento(event, 'avatar-img')">
                                </label>
                            </div>
